tests:
  simple_test:
  - i2c:
      dev:
        name: "I2C 0"
        driver: "I2C_SMBus"
        bus: 0
      devices:
      - name: "Sensor name"
        address: 0x1C
  - gpio:
      test_name: "GPIO 20 write test"
      dev:
        name: "GPIO 0"
        driver: "GPIO_sysfs"
      pins:
        - pin: 20
          direction: out
          state: on

  camera_test:
  - camera:
      device: "/dev/video0"
      camera_name: "vivid"
      driver_name: "vivid"

test-suites:
  local:
    tests:
    - simple_test
    - camera_test
