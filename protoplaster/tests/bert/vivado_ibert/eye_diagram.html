{% extends "base.html" %}

{% block content %}
<h2>Eye diagram</h2>

<div class="diagram">
  <img src="{{ png_name }}" alt="Eye diagram">
</div>

<div class="stats">
  <div>Eye width:</div>
  <span>{{ eye_width }}</span>

  <div>Eye height:</div>
  <span>{{ eye_height }}</span>
</div>

<style>
.diagram {
  margin-top: 15px;
}

.diagram img {
  max-width: 100%;
}

.stats {
  display: grid;
  width: 15em;
  grid-template-columns: 1fr 1fr;
  margin-left: 3em;
}
</style>
{% endblock %}
